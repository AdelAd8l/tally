# One-click deploy: https://render.com/deploy?repo=https://github.com/AdelAd8l/tally
services:
  - type: web
    name: tally
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: TALLY_SECRET_KEY
        generateValue: true
      # Paste a Postgres connection string (e.g. a free Neon database).
      # Render's free disk is wiped on every deploy, so SQLite would lose your data.
      - key: TALLY_DATABASE_URL
        sync: false
      - key: TALLY_COOKIE_SECURE
        value: "true"
      # Flip to "false" once you've created your account.
      - key: TALLY_ALLOW_SIGNUP
        value: "true"
